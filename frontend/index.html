<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 电商智能客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .topbar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
            gap: 12px;
        }
        .topbar a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        .topbar a:hover { color: white; }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 4px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .chat-box {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; }
        .message.user { align-self: flex-end; background: #667eea; color: white; }
        .message.assistant { align-self: flex-start; background: #f1f3f5; color: #333; }
        .meta { font-size: 11px; margin-top: 4px; opacity: 0.7; }
        .sources { font-size: 11px; margin-top: 4px; color: #667eea; }
        .input-area {
            padding: 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #667eea; }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .input-area button:hover { transform: scale(1.05); }
        .input-area button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .intent-tag {
            display: inline-block;
            padding: 2px 8px;
            background: #e7f5ff;
            color: #1971c2;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 4px;
        }
        .loading { text-align: center; padding: 12px; color: #999; }
        .error { background: #fff3f3; color: #c92a2a; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        .ws-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.9);
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="wsStatus" class="ws-status">○ 连接中...</div>
    <div class="topbar">
        <a href="/admin/" target="_blank">管理后台</a>
        <span style="color:rgba(255,255,255,0.4)">|</span>
        <a href="/metrics" target="_blank">Prometheus</a>
    </div>
    <div class="container">
        <div class="header">
            <h1>RAG 电商智能客服</h1>
            <p>基于 RAG 的智能问答系统 · 支持商品咨询 / 订单查询 / 退换货</p>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message assistant">
                您好！我是智能客服小 RAG，请问有什么可以帮您？
                <div class="meta">RAG Customer Service · v1.0</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入您的问题，按 Enter 发送..." />
            <button id="undoBtn" onclick="undoLastMessage()" title="撤回最后一条消息" style="background:#666;margin-right:8px">↩</button>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        let sessionId = null;
        const chatBox = document.getElementById('chatBox');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // WebSocket 配置
        let ws = null;
        let wsConnected = false;
        const wsReconnectDelay = 1000;
        let wsReconnectTimer = null;
        let accumulatedResponse = "";
        let currentPlaceholder = null;

        // 初始化 WebSocket 连接
        function initWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat?user_id=guest${sessionId ? '&session_id=' + sessionId : ''}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                wsConnected = true;
                updateConnectionStatus(true);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                wsConnected = false;
                updateConnectionStatus(false);

                // 指数退避重连
                if (!wsReconnectTimer) {
                    wsReconnectTimer = setTimeout(() => {
                        wsReconnectTimer = null;
                        initWebSocket();
                    }, Math.min(wsReconnectDelay * 2, 30000));
                }
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleWsMessage(data);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };
        }

        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('wsStatus');
            if (statusEl) {
                statusEl.textContent = connected ? '● 已连接' : '○ 已断开';
                statusEl.style.color = connected ? '#4caf50' : '#999';
            }
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast') || (() => {
                const el = document.createElement('div');
                el.id = 'toast';
                el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#333;color:white;border-radius:4px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s';
                document.body.appendChild(el);
                return el;
            })();
            toast.textContent = msg;
            toast.style.opacity = 1;
            setTimeout(() => { toast.style.opacity = 0; }, 2000);
        }

        // 处理 WebSocket 消息
        function handleWsMessage(data) {
            switch (data.type) {
                case 'chunk':
                    // 流式片��
                    if (currentPlaceholder) {
                        accumulatedResponse += data.content;
                        currentPlaceholder.innerHTML = accumulatedResponse + '▌';
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                    break;

                case 'done':
                    // 完成
                    if (currentPlaceholder) {
                        currentPlaceholder.innerHTML = accumulatedResponse || '（无内容）';
                        let meta = '';
                        if (data.intent) {
                            meta += `<div class="intent-tag">意图: ${data.intent}</div>`;
                        }
                        if (data.sources && data.sources.length > 0) {
                            meta += `<div class="sources">来源: ${data.sources.join(', ')}</div>`;
                        }
                        if (meta) {
                            currentPlaceholder.innerHTML += meta;
                        }
                    }
                    sessionId = data.session_id;
                    currentPlaceholder = null;
                    accumulatedResponse = "";
                    sendBtn.disabled = false;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    break;

                case 'message_received':
                    // 消息已接收，开始流式输出
                    sessionId = data.session_id;
                    accumulatedResponse = "";
                    break;

                case 'error':
                    // 错误
                    if (currentPlaceholder) {
                        currentPlaceholder.innerHTML = `<div class="error">错误: ${data.message}</div>`;
                    }
                    currentPlaceholder = null;
                    accumulatedResponse = "";
                    sendBtn.disabled = false;
                    break;

                case 'message_deleted':
                    if (data.success) {
                        // 移除最后一条用户消息和助手回复
                        const messages = chatBox.querySelectorAll('.message');
                        if (messages.length >= 2) {
                            chatBox.removeChild(messages[messages.length - 1]);
                            chatBox.removeChild(messages[messages.length - 2]);
                        }
                        showToast('消息已撤回', 'success');
                    } else {
                        showToast(data.message || '撤回失败', 'error');
                    }
                    break;

                case 'pong':
                    break;
            }
        }

        // 发送消息
        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;
            if (!wsConnected) {
                alert('WebSocket 未连接，请等待...');
                return;
            }

            input.value = '';
            sendBtn.disabled = true;

            // 用户消息
            addMessage('user', message);

            // 助手占位符
            currentPlaceholder = addMessage('assistant', '正在思考中...', true);
            accumulatedResponse = "";

            // 发送 WebSocket 消息
            ws.send(JSON.stringify({
                type: 'message',
                content: message,
                session_id: sessionId || undefined
            }));
        }

        // 撤回最后一条消息
        async function undoLastMessage() {
            if (!wsConnected) {
                alert('WebSocket 未连接');
                return;
            }
            ws.send(JSON.stringify({ type: 'delete', message_id: 0 })); // message_id=0 表示删除最后一条
            showToast('已发送撤回请求', 'info');
        }

        function addMessage(role, content, isPlaceholder = false) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = isPlaceholder ? content : content;
            if (isPlaceholder) div.id = 'current-response';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            initWebSocket();
        });

        // 页面卸载时关闭
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>

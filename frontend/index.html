<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能客服</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #242b3d;
            --bg-hover: #2d3548;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #334155;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部导航 */
        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 18px;
        }
        
        .navbar-brand svg {
            width: 32px;
            height: 32px;
        }
        
        .navbar-status {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-card);
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid var(--border);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected { background: var(--success); animation: none; }
        .status-dot.error { background: var(--error); animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }
        
        .auth-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-card);
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .auth-badge.authenticated { color: var(--success); }
        .auth-badge.failed { color: var(--error); }
        
        /* 主容器 */
        .main-container {
            flex: 1;
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 24px;
            gap: 24px;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .sidebar-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px;
        }
        
        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        
        /* 心跳监控 */
        .heartbeat-monitor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .hb-stat {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        
        .hb-stat-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-light);
        }
        
        .hb-stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        
        .hb-last-activity {
            margin-top: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        
        /* 聊天区域 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        /* 聊天头部 */
        .chat-header {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-secondary) 100%);
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .chat-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        
        .chat-info h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .chat-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .chat-stats {
            margin-left: auto;
            display: flex;
            gap: 16px;
        }
        
        .chat-stat {
            text-align: center;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 10px;
        }
        
        .chat-stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-light);
        }
        
        .chat-stat-label {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        /* 消息区域 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        
        /* 消息气泡 */
        .message {
            max-width: 70%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.6;
            animation: slideIn 0.3s ease;
            position: relative;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }
        
        .message.assistant {
            align-self: flex-start;
            background: var(--bg-card);
            color: var(--text-primary);
            border-bottom-left-radius: 6px;
        }
        
        .message.error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }
        
        .message-content { word-break: break-word; white-space: pre-wrap; }
        .message-content .typing-cursor { animation: blink 1s infinite; }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .message-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            font-size: 11px;
            opacity: 0.7;
        }
        
        .intent-tag {
            display: inline-flex;
            padding: 3px 8px;
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border-radius: 4px;
            font-weight: 500;
        }
        
        .sources-info {
            font-size: 11px;
            color: var(--accent-light);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* 输入区域 */
        .chat-input-area {
            padding: 20px 24px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .input-container {
            flex: 1;
            position: relative;
        }
        
        .input-container input {
            width: 100%;
            padding: 14px 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
        }
        
        .input-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .input-container input::placeholder { color: var(--text-muted); }
        
        .btn-send {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        
        .btn-send:hover { transform: scale(1.05); }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-send svg { width: 20px; height: 20px; stroke: white; }
        
        .quick-questions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .quick-q {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .quick-q:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 24px;
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 12px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }
        
        /* 响应式 */
        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .main-container { padding: 16px; }
        }
        
        @media (max-width: 768px) {
            .chat-stats { display: none; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <svg viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="8" fill="url(#grad)"/>
                <path d="M10 16h12M16 10v12" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32">
                        <stop stop-color="#6366f1"/>
                        <stop offset="1" stop-color="#818cf8"/>
                    </linearGradient>
                </defs>
            </svg>
            RAG 智能客服
        </div>
        <div class="navbar-status">
            <div class="auth-badge" id="authBadge">
                <span>🔐</span>
                <span id="authText">未认证</span>
            </div>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">连接中...</span>
            </div>
        </div>
    </nav>
    
    <!-- 主内容 -->
    <main class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">连接状态</div>
                <div class="heartbeat-monitor">
                    <div class="hb-stat">
                        <div class="hb-stat-value" id="pingCount">0</div>
                        <div class="hb-stat-label">发送 Ping</div>
                    </div>
                    <div class="hb-stat">
                        <div class="hb-stat-value" id="pongCount">0</div>
                        <div class="hb-stat-label">收到 Pong</div>
                    </div>
                    <div class="hb-stat">
                        <div class="hb-stat-value" id="msgSent">0</div>
                        <div class="hb-stat-label">已发送</div>
                    </div>
                    <div class="hb-stat">
                        <div class="hb-stat-value" id="msgReceived">0</div>
                        <div class="hb-stat-label">已接收</div>
                    </div>
                </div>
                <div class="hb-last-activity" id="lastActivity">
                    最后活动: -
                </div>
            </div>
        </aside>
        
        <!-- 聊天区 -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-avatar">🤖</div>
                <div class="chat-info">
                    <h2>智能助手</h2>
                    <p>基于 RAG 的电商问答系统</p>
                </div>
                <div class="chat-stats">
                    <div class="chat-stat">
                        <div class="chat-stat-value" id="sessionCount">-</div>
                        <div class="chat-stat-label">会话 ID</div>
                    </div>
                    <div class="chat-stat">
                        <div class="chat-stat-value" id="uptime">0s</div>
                        <div class="chat-stat-label">在线时长</div>
                    </div>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-content">您好！我是 RAG 智能客服助手，有什么可以帮您的吗？</div>
                    <div class="message-meta">
                        <span>在线</span>
                        <span>•</span>
                        <span>v2.0</span>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <div class="input-container">
                        <input type="text" id="messageInput" placeholder="输入您的问题，按 Enter 发送..." />
                    </div>
                    <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22,2 15,22 11,13 2,9"/>
                        </svg>
                    </button>
                </div>
                <div class="quick-questions">
                    <span class="quick-q" onclick="askQuestion('查询我的订单状态')">📦 查询订单</span>
                    <span class="quick-q" onclick="askQuestion('有哪些促销商品？')">🛍️ 促销</span>
                    <span class="quick-q" onclick="askQuestion('如何申请退换货？')">↩️ 退换货</span>
                    <span class="quick-q" onclick="askQuestion('有什么优惠政策？')">💰 优惠</span>
                </div>
            </div>
        </div>
    </main>
    
    <div id="toast" class="toast"></div>
    
    <script>
        // ==================== DOM 元素缓存 ====================
        const dom = {
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            authBadge: document.getElementById('authBadge'),
            authText: document.getElementById('authText'),
            chatMessages: document.getElementById('chatMessages'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            toast: document.getElementById('toast'),
            pingCount: document.getElementById('pingCount'),
            pongCount: document.getElementById('pongCount'),
            msgSent: document.getElementById('msgSent'),
            msgReceived: document.getElementById('msgReceived'),
            lastActivity: document.getElementById('lastActivity'),
            sessionCount: document.getElementById('sessionCount'),
            uptime: document.getElementById('uptime'),
        };

        // ==================== 配置 ====================
        const CONFIG = {
            API_BASE: '',
            WS_HEARTBEAT_INTERVAL: 30000,  // 30秒，由 config.py 同步
            WS_HEARTBEAT_TIMEOUT: 60000,    // 60秒
            MAX_RETRIES: 5,
            RETRY_DELAY: 2000,
            RECONNECT_BASE_DELAY: 1000,
            RECONNECT_MAX_DELAY: 30000,
        };
        
        // ==================== 状态 ====================
        const state = {
            ws: null,
            token: null,
            sessionId: null,
            userId: 'user-' + Math.random().toString(36).substr(2, 8),
            status: 'disconnected', // disconnected, connecting, authenticating, authenticated, connected, reconnecting
            retryCount: 0,
            pingCount: 0,
            pongCount: 0,
            msgSent: 0,
            msgReceived: 0,
            lastPingTime: null,
            lastPongTime: null,
            lastActivity: null,
            connectedAt: null,
            heartbeatTimer: null,
            pongTimer: null,
            reconnectTimer: null,
            uptimeTimer: null,
            accumulatedResponse: '',
            currentPlaceholder: null,
            // 商品上下文
            productContext: null,
            urlSkuId: null,
            urlSpuId: null,
        };
        
        // ==================== 商品上下文相关 ====================
        
        // 解析URL参数
        function parseUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const skuId = params.get('sku_id');
            const spuId = params.get('spu_id');
            
            state.urlSkuId = skuId ? parseInt(skuId) : null;
            state.urlSpuId = spuId ? parseInt(spuId) : null;
            
            return (state.urlSkuId || state.urlSpuId);
        }
        
        // 加载商品上下文（REST API）
        async function loadProductContext() {
            if (!state.urlSkuId && !state.urlSpuId) return null;
            
            try {
                const params = new URLSearchParams();
                if (state.urlSkuId) params.append('sku_id', state.urlSkuId);
                if (state.urlSpuId) params.append('spu_id', state.urlSpuId);
                
                const response = await fetch(`/api/v1/products/context?${params.toString()}`);
                const data = await response.json();
                
                if (data.success && data.data) {
                    state.productContext = data.data;
                    addProductCard(data.data);
                    return data.data;
                } else {
                    console.warn('商品上下文加载失败:', data.error);
                }
            } catch (error) {
                console.error('加载商品上下文失败:', error);
            }
            return null;
        }
        
        // 添加商品信息卡片到聊天界面
        function addProductCard(productContext) {
            const container = dom.chatMessages;
            
            // 避免重复添加
            const existingCards = container.querySelectorAll('.product-info-card');
            if (existingCards.length > 0) return;
            
            // 构建商品信息HTML
            let infoHtml = '';
            
            // 商品名称和类型标签
            infoHtml += `<div style="font-weight:700;font-size:14px;margin-bottom:8px;color:var(--accent-light);display:flex;align-items:center;gap:8px">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27,6.96 12,12.01 20.73,6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                ${escapeHtml(productContext.product_name || '商品')}
                <span style="font-weight:400;font-size:11px;color:var(--text-muted);margin-left:4px">
                    [${productContext.product_type || 'SPU'}]
                </span>
            </div>`;
            
            // 价格和库存
            if (productContext.product_type === 'SKU') {
                if (productContext.sku_price !== undefined && productContext.sku_price !== null) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
                        💰 价格: $${productContext.sku_price.toFixed(2)}
                    </div>`;
                }
                if (productContext.sku_stock !== undefined && productContext.sku_stock !== null) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
                        📦 库存: ${productContext.sku_stock}
                    </div>`;
                }
                if (productContext.properties) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
                        ⚙️ 规格: ${escapeHtml(JSON.stringify(productContext.properties))}
                    </div>`;
                }
                if (productContext.bar_code) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
                        📊 条形码: ${escapeHtml(productContext.bar_code)}
                    </div>`;
                }
            } else {
                if (productContext.price !== undefined && productContext.price !== null) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
                        💰 价格: $${productContext.price.toFixed(2)}
                    </div>`;
                }
                if (productContext.stock !== undefined && productContext.stock !== null) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
                        📦 库存: ${productContext.stock}
                    </div>`;
                }
                if (productContext.market_price !== undefined && productContext.market_price !== null) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
                        🏷️ 市场价: $${productContext.market_price.toFixed(2)}
                    </div>`;
                }
                if (productContext.sales_count !== undefined) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
                        🔥 销量: ${productContext.sales_count}
                    </div>`;
                }
            }
            
            // 商品简介
            if (productContext.parsed_introduction && productContext.parsed_introduction.length > 0) {
                const introTexts = productContext.parsed_introduction
                    .filter(seg => seg.type === 'text')
                    .map(seg => seg.content)
                    .join(' ');
                if (introTexts) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin:8px 0;padding:8px;background:var(--bg-card);border-radius:8px;border-left:3px solid var(--accent)">
                        <div style="font-weight:600;margin-bottom:4px">📝 商品简介:</div>
                        ${escapeHtml(introTexts.slice(0, 300))}${introTexts.length > 300 ? '...' : ''}
                    </div>`;
                }
            }
            
            // 商品详情（简要）
            if (productContext.parsed_description && productContext.parsed_description.length > 0) {
                const descTexts = productContext.parsed_description
                    .filter(seg => seg.type === 'text')
                    .map(seg => seg.content)
                    .join(' ');
                if (descTexts) {
                    infoHtml += `<div style="font-size:12px;color:var(--text-secondary);margin:8px 0;padding:8px;background:var(--bg-card);border-radius:8px;border-left:3px solid var(--violet)">
                        <div style="font-weight:600;margin-bottom:4px">📋 商品详情:</div>
                        ${escapeHtml(descTexts.slice(0, 200))}${descTexts.length > 200 ? '...' : ''}
                    </div>`;
                }
            }
            
            // 标记特殊属性
            const badges = [];
            if (productContext.has_images) {
                badges.push(`<span style="font-size:10px;background:var(--success);color:white;padding:2px 8px;border-radius:12px;margin-right:4px">📷 含图片</span>`);
            }
            if (productContext.has_html) {
                badges.push(`<span style="font-size:10px;background:var(--warning);color:white;padding:2px 8px;border-radius:12px;margin-right:4px">📄 HTML</span>`);
            }
            if (badges.length > 0) {
                infoHtml += `<div style="margin-top:8px">${badges.join('')}</div>`;
            }
            
            // 创建卡片
            const card = document.createElement('div');
            card.className = 'message assistant product-info-card';
            card.innerHTML = `<div class="message-content">${infoHtml}</div>
                <div class="message-meta">
                    <span>✅ 商品信息已加载 · ID: ${state.urlSkuId || state.urlSpuId}</span>
                </div>`;
            container.appendChild(card);
            container.scrollTop = container.scrollHeight;
        }
        
        // 将商品上下文保存到sessionStorage，供后端RAG流程使用
        function saveProductContextToSession() {
            if (state.productContext) {
                sessionStorage.setItem('product_context', JSON.stringify(state.productContext));
            }
        }
        
        // ==================== 工具函数 ====================
        function showToast(msg, type = 'info') {
            dom.toast.textContent = msg;
            dom.toast.className = 'toast show ' + type;
            setTimeout(() => { dom.toast.className = 'toast'; }, 3000);
        }
        
        function updateActivity() {
            state.lastActivity = Date.now();
            const time = new Date().toLocaleTimeString();
            dom.lastActivity.textContent = `最后活动: ${time}`;
        }
        
        function updateStats() {
            dom.pingCount.textContent = state.pingCount;
            dom.pongCount.textContent = state.pongCount;
            dom.msgSent.textContent = state.msgSent;
            dom.msgReceived.textContent = state.msgReceived;
        }
        
        function updateUptime() {
            if (!state.connectedAt) {
                dom.uptime.textContent = '0s';
                return;
            }
            const elapsed = Math.floor((Date.now() - state.connectedAt) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            dom.uptime.textContent = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        }
        
        function setStatus(status, text) {
            state.status = status;
            dom.statusDot.className = 'status-dot';
            
            switch (status) {
                case 'disconnected':
                case 'reconnecting':
                    dom.statusText.textContent = text || '重连中...';
                    break;
                case 'connecting':
                    dom.statusText.textContent = text || '连接中...';
                    break;
                case 'authenticating':
                    dom.statusText.textContent = text || '认证中...';
                    break;
                case 'connected':
                    dom.statusDot.classList.add('connected');
                    dom.statusText.textContent = text || '已连接';
                    break;
                case 'error':
                    dom.statusDot.classList.add('error');
                    dom.statusText.textContent = text || '连接失败';
                    break;
            }
        }
        
        function setAuthStatus(authenticated, text) {
            dom.authBadge.className = 'auth-badge ' + (authenticated ? 'authenticated' : 'failed');
            dom.authText.textContent = text || (authenticated ? '已认证' : '认证失败');
        }
        
        // ==================== 消息处理 ====================
        function handleMessage(data) {
            state.msgReceived++;
            updateStats();
            updateActivity();
            
            switch (data.type) {
                case 'chunk':
                    handleChunk(data);
                    break;
                    
                case 'done':
                    handleDone(data);
                    break;
                    
                case 'message_received':
                    state.sessionId = data.session_id;
                    dom.sessionCount.textContent = state.sessionId?.substr(0, 8) || '-';
                    state.accumulatedResponse = '';
                    break;
                
                case 'connected':
                    // WebSocket连接成功，处理商品上下文
                    if (data.product_context) {
                        state.productContext = data.product_context;
                        addProductCard(data.product_context);
                        showToast(`已加载商品: ${data.product_context.product_name}`, 'success');
                    }
                    break;
                    
                case 'error':
                    handleError(data);
                    break;
                    
                case 'message_deleted':
                    handleDeleted(data);
                    break;
                    
                case 'ping':
                    handleServerPing(data);
                    break;
                    
                case 'pong':
                    handlePong(data);
                    break;
                    
                default:
                    console.log('Unknown message type:', data.type);
            }
        }
        
        function handleChunk(data) {
            if (state.currentPlaceholder) {
                state.accumulatedResponse += data.content;
                const contentEl = state.currentPlaceholder.querySelector('.message-content');
                if (contentEl) {
                    contentEl.innerHTML = escapeHtml(state.accumulatedResponse) + '<span class="typing-cursor">▌</span>';
                }
                dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
            }
        }
        
        function handleDone(data) {
            if (state.currentPlaceholder) {
                const contentEl = state.currentPlaceholder.querySelector('.message-content');
                if (contentEl) {
                    contentEl.textContent = state.accumulatedResponse || '（无内容）';
                }
                
                let metaHtml = '<div class="message-meta">';
                if (data.intent) {
                    metaHtml += `<span class="intent-tag">${escapeHtml(data.intent)}</span>`;
                }
                metaHtml += '</div>';
                
                if (data.sources && data.sources.length > 0) {
                    metaHtml += `<div class="sources-info">📚 来源: ${escapeHtml(data.sources.slice(0, 3).join(', '))}</div>`;
                }
                
                state.currentPlaceholder.innerHTML += metaHtml;
            }
            
            state.sessionId = data.session_id;
            dom.sessionCount.textContent = state.sessionId?.substr(0, 8) || '-';
            state.currentPlaceholder = null;
            state.accumulatedResponse = '';
            dom.sendBtn.disabled = false;
            dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
        }
        
        function handleError(data) {
            if (state.currentPlaceholder) {
                const contentEl = state.currentPlaceholder.querySelector('.message-content');
                if (contentEl) {
                    contentEl.innerHTML = `<span style="color: var(--error)">错误: ${escapeHtml(data.message)}</span>`;
                }
            }
            state.currentPlaceholder = null;
            state.accumulatedResponse = '';
            dom.sendBtn.disabled = false;
            showToast(data.message || '发生错误', 'error');
        }
        
        function handleDeleted(data) {
            if (data.success) {
                const messages = dom.chatMessages.querySelectorAll('.message');
                if (messages.length >= 2) {
                    dom.chatMessages.removeChild(messages[messages.length - 1]);
                    dom.chatMessages.removeChild(messages[messages.length - 2]);
                }
                showToast('消息已撤回', 'success');
            } else {
                showToast(data.message || '撤回失败', 'error');
            }
        }
        
        function handleServerPing(data) {
            // 服务器发来的 ping，回复 pong
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    type: 'pong',
                    timestamp: data.timestamp || Date.now()
                }));
            }
        }
        
        function handlePong(data) {
            // 收到对客户端 ping 的响应
            state.pongCount++;
            state.lastPongTime = Date.now();
            clearTimeout(state.pongTimer);
            updateStats();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ==================== 心跳 ====================
        function startHeartbeat() {
            stopHeartbeat();
            
            // 主心跳定时器
            state.heartbeatTimer = setInterval(() => {
                if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                    // 发送 ping
                    state.ws.send(JSON.stringify({
                        type: 'ping',
                        timestamp: Date.now()
                    }));
                    state.pingCount++;
                    state.lastPingTime = Date.now();
                    updateStats();
                    
                    // 设置 pong 超时
                    state.pongTimer = setTimeout(() => {
                        console.error('Pong timeout - connection may be dead');
                        setStatus('error', '心跳超时');
                        state.ws.close();
                    }, CONFIG.WS_HEARTBEAT_TIMEOUT);
                }
            }, CONFIG.WS_HEARTBEAT_INTERVAL);
            
            // 在线时长定时器
            state.uptimeTimer = setInterval(updateUptime, 1000);
        }
        
        function stopHeartbeat() {
            if (state.heartbeatTimer) {
                clearInterval(state.heartbeatTimer);
                state.heartbeatTimer = null;
            }
            if (state.pongTimer) {
                clearTimeout(state.pongTimer);
                state.pongTimer = null;
            }
            if (state.uptimeTimer) {
                clearInterval(state.uptimeTimer);
                state.uptimeTimer = null;
            }
        }
        
        // ==================== 重连 ====================
        function scheduleReconnect() {
            if (state.retryCount >= CONFIG.MAX_RETRIES) {
                setStatus('error', '连接失败');
                showToast(`连接失败，已达到最大重试次数 (${CONFIG.MAX_RETRIES})`, 'error');
                return;
            }
            
            // 指数退避
            const delay = Math.min(
                CONFIG.RECONNECT_BASE_DELAY * Math.pow(2, state.retryCount),
                CONFIG.RECONNECT_MAX_DELAY
            );
            
            setStatus('reconnecting', `重连中 (${state.retryCount + 1}/${CONFIG.MAX_RETRIES})...`);
            
            state.reconnectTimer = setTimeout(() => {
                state.retryCount++;
                connectWebSocket();
            }, delay);
        }
        
        // ==================== WebSocket ====================
        async function init() {
            setStatus('connecting', '获取认证...');
            
            // 解析URL参数
            const hasProductParams = parseUrlParams();
            if (hasProductParams) {
                const info = [];
                if (state.urlSkuId) info.push(`SKU: ${state.urlSkuId}`);
                if (state.urlSpuId) info.push(`SPU: ${state.urlSpuId}`);
                console.log('检测到商品参数:', info.join(', '));
            }
            
            // 获取 token
            try {
                const response = await fetch(`${CONFIG.API_BASE}/api/v1/debug/auth/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: state.userId, role: 'user' })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `HTTP ${response.status}: 认证接口返回错误`);
                }

                const data = await response.json();

                if (!data.token) {
                    throw new Error('认证接口未返回token');
                }

                state.token = data.token;
                setAuthStatus(true, '已认证');
                console.log('Token acquired successfully:', state.token.substring(0, 30) + '...');

            } catch (err) {
                console.error('Auth error:', err);
                setAuthStatus(false, '认证失败');
                showToast('认证失败: ' + err.message, 'error');
                return;  // 认证失败，停止连接
            }

            console.log('Token obtained, connecting to WebSocket...');
            connectWebSocket();
        }
        
        function connectWebSocket() {
            if (state.ws) {
                state.ws.close();
                state.ws = null;
            }

            // 确保 token 存在
            if (!state.token) {
                console.error('No token available, cannot connect WebSocket');
                setStatus('error', '未获取到认证令牌');
                showToast('请先获取认证令牌', 'error');
                return;
            }

            setStatus('connecting', '连接中...');

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            // 构建WebSocket URL（仅传递必要的参数）
            let wsUrl = `${protocol}//${host}/ws/chat?token=${encodeURIComponent(state.token)}`;

            // 传递 session_id（如果存在）
            if (state.sessionId) {
                wsUrl += `&session_id=${encodeURIComponent(state.sessionId)}`;
            }

            // 传递URL中的商品参数到WebSocket
            if (state.urlSkuId) {
                wsUrl += `&sku_id=${encodeURIComponent(state.urlSkuId)}`;
            }
            if (state.urlSpuId) {
                wsUrl += `&spu_id=${encodeURIComponent(state.urlSpuId)}`;
            }

            console.log('Connecting to WebSocket:', wsUrl);
            state.ws = new WebSocket(wsUrl);
            
            state.ws.onopen = () => {
                console.log('WebSocket connected');
                state.retryCount = 0;
                state.connectedAt = Date.now();
                setStatus('connected');
                updateActivity();
                startHeartbeat();
            };
            
            state.ws.onclose = (event) => {
                console.log('WebSocket disconnected', event.code, event.reason);
                stopHeartbeat();
                
                // 1000 是正常关闭，不需要重连
                if (event.code === 1000) {
                    setStatus('disconnected', '已断开');
                    return;
                }
                
                setStatus('reconnecting');
                scheduleReconnect();
            };
            
            state.ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                setStatus('error', '连接错误');
            };
            
            state.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };
        }
        
        function sendMessage() {
            const message = dom.messageInput.value.trim();
            if (!message) return;
            
            if (state.status !== 'connected') {
                showToast('WebSocket 未连接', 'error');
                return;
            }
            
            dom.messageInput.value = '';
            dom.sendBtn.disabled = true;
            
            // 添加用户消息
            addMessage('user', message);
            state.msgSent++;
            updateStats();
            
            // 添加助手占位
            state.currentPlaceholder = addMessage('assistant', '正在思考中...', true);
            state.accumulatedResponse = '';
            
            // 发送消息
            state.ws.send(JSON.stringify({
                type: 'message',
                content: message,
                session_id: state.sessionId || undefined
            }));
        }
        
        function addMessage(role, content, isPlaceholder = false) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="message-content">${content}</div>`;
            dom.chatMessages.appendChild(div);
            dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
            
            if (!isPlaceholder) {
                updateActivity();
            }
            
            return div;
        }
        
        function askQuestion(question) {
            dom.messageInput.value = question;
            sendMessage();
        }
        
        function undoLastMessage() {
            if (state.status !== 'connected') {
                showToast('WebSocket 未连接', 'error');
                return;
            }
            state.ws.send(JSON.stringify({ type: 'delete', message_id: 0 }));
            showToast('撤回请求已发送');
        }
        
        // ==================== 事件绑定 ====================
        dom.messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        window.addEventListener('beforeunload', () => {
            stopHeartbeat();
            if (state.ws) state.ws.close();
        });
        
        // ==================== 启动 ====================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
